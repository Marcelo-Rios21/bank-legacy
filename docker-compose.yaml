services:

  kafka:
    image: apache/kafka:4.1.2
    container_name: bank-legacy-kafka
    hostname: kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092"
      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  config-server:
    build:
      context: ./cloud/config-server
    image: bank-legacy-config-server:s8
    container_name: bank-legacy-config-server
    ports:
      - "127.0.0.1:8888:8888"
    environment:
      CONFIG_REPO_PATH: "file:/config-repo"
    volumes:
      - ./cloud/config-repo:/config-repo:ro

  discovery-server:
    build:
      context: ./cloud/discovery-server
    image: bank-legacy-discovery-server:s8
    container_name: bank-legacy-discovery-server
    ports:
      - "127.0.0.1:8761:8761"
    environment:
      EUREKA_INSTANCE_HOSTNAME: "discovery-server"

  authorization-server:
    build:
      context: ./cloud/authorization-server
    image: bank-legacy-authorization-server:s8
    container_name: bank-legacy-authorization-server
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      OAUTH2_CLIENT_ID: "${OAUTH2_CLIENT_ID}"
      OAUTH2_CLIENT_SECRET: "${OAUTH2_CLIENT_SECRET}"
      OAUTH2_ISSUER_URI: "http://authorization-server:9000"

  account-service:
    build:
      context: ./microservices/account-service
    image: bank-legacy-account-service:s8
    container_name: bank-legacy-account-service
    ports:
      - "127.0.0.1:8091:8091"
    environment:
      CONFIG_SERVER_URL: "http://config-server:8888"
      EUREKA_URL: "http://discovery-server:8761/eureka/"
      OAUTH2_ISSUER_URI: "http://authorization-server:9000"
      DB_URL: "${DB_URL}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"
    depends_on:
      config-server:
        condition: service_started
      discovery-server:
        condition: service_started
      authorization-server:
        condition: service_started
    restart: on-failure

  transaction-service:
    build:
      context: ./microservices/transaction-service
    image: bank-legacy-transaction-service:s8
    container_name: bank-legacy-transaction-service
    ports:
      - "127.0.0.1:8092:8092"
    environment:
      CONFIG_SERVER_URL: "http://config-server:8888"
      EUREKA_URL: "http://discovery-server:8761/eureka/"
      OAUTH2_ISSUER_URI: "http://authorization-server:9000"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:19092"
      DB_URL: "${DB_URL}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"
    depends_on:
      kafka:
        condition: service_healthy
      config-server:
        condition: service_started
      discovery-server:
        condition: service_started
      authorization-server:
        condition: service_started
    restart: on-failure

  movement-service:
    build:
      context: ./microservices/movement-service
    image: bank-legacy-movement-service:s8
    container_name: bank-legacy-movement-service
    ports:
      - "127.0.0.1:8093:8093"
    environment:
      CONFIG_SERVER_URL: "http://config-server:8888"
      EUREKA_URL: "http://discovery-server:8761/eureka/"
      OAUTH2_ISSUER_URI: "http://authorization-server:9000"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:19092"
      DB_URL: "${DB_URL}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"
    depends_on:
      kafka:
        condition: service_healthy
      config-server:
        condition: service_started
      discovery-server:
        condition: service_started
      authorization-server:
        condition: service_started
    restart: on-failure
