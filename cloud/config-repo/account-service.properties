server.port=8091
bank.service.description=Account microservice configuration from Config Server

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
# Circuit Breaker Oracle
resilience4j.circuitbreaker.instances.accountDatabase.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.accountDatabase.sliding-window-size=4
resilience4j.circuitbreaker.instances.accountDatabase.minimum-number-of-calls=2
resilience4j.circuitbreaker.instances.accountDatabase.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.accountDatabase.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.accountDatabase.permitted-number-of-calls-in-half-open-state=1
resilience4j.circuitbreaker.instances.accountDatabase.automatic-transition-from-open-to-half-open-enabled=true
spring.cloud.circuitbreaker.resilience4j.disable-time-limiter-map.accountDatabase=true
