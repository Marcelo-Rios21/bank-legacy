server.port=8093
bank.service.description=Movement microservice configuration from Config Server

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
# Circuit Breaker Oracle
resilience4j.circuitbreaker.instances.movementDatabase.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.movementDatabase.sliding-window-size=4
resilience4j.circuitbreaker.instances.movementDatabase.minimum-number-of-calls=2
resilience4j.circuitbreaker.instances.movementDatabase.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.movementDatabase.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.movementDatabase.permitted-number-of-calls-in-half-open-state=1
resilience4j.circuitbreaker.instances.movementDatabase.automatic-transition-from-open-to-half-open-enabled=true
spring.cloud.circuitbreaker.resilience4j.disable-time-limiter-map.movementDatabase=true
spring.kafka.bootstrap-servers=localhost:9092
bank.kafka.topic=bank.transactions
spring.kafka.consumer.group-id=movement-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties[spring.json.value.default.type]=com.bank.microservices.movement.event.TransactionSnapshotPublished
spring.kafka.consumer.properties[spring.json.use.type.headers]=false
spring.kafka.consumer.properties[spring.json.trusted.packages]=com.bank.microservices.movement.event

spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH2_ISSUER_URI:http://localhost:9000}
