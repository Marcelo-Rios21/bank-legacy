<svg xmlns="http://www.w3.org/2000/svg"
     width="1600"
     height="1050"
     viewBox="0 0 1600 1050">

  <defs>
    <marker id="arrow"
            markerWidth="10"
            markerHeight="10"
            refX="9"
            refY="3"
            orient="auto"
            markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>

    <style>
      .title {
        font: bold 34px Arial, sans-serif;
        fill: #0f172a;
      }

      .subtitle {
        font: 20px Arial, sans-serif;
        fill: #475569;
      }

      .section {
        font: bold 22px Arial, sans-serif;
        fill: #0f172a;
      }

      .boxTitle {
        font: bold 18px Arial, sans-serif;
        fill: #0f172a;
      }

      .text {
        font: 16px Arial, sans-serif;
        fill: #334155;
      }

      .small {
        font: 14px Arial, sans-serif;
        fill: #475569;
      }

      .box {
        fill: #ffffff;
        stroke: #64748b;
        stroke-width: 2;
        rx: 12;
      }

      .batch {
        fill: #eff6ff;
        stroke: #2563eb;
      }

      .bff {
        fill: #f5f3ff;
        stroke: #7c3aed;
      }

      .cloud {
        fill: #ecfeff;
        stroke: #0891b2;
      }

      .service {
        fill: #f0fdf4;
        stroke: #16a34a;
      }

      .infra {
        fill: #fff7ed;
        stroke: #ea580c;
      }

      .database {
        fill: #fefce8;
        stroke: #ca8a04;
      }

      .boundary {
        fill: none;
        stroke: #94a3b8;
        stroke-width: 2;
        stroke-dasharray: 10 7;
        rx: 18;
      }

      .arrow {
        stroke: #334155;
        stroke-width: 2;
        fill: none;
        marker-end: url(#arrow);
      }

      .dash {
        stroke: #64748b;
        stroke-width: 2;
        fill: none;
        stroke-dasharray: 7 6;
        marker-end: url(#arrow);
      }
    </style>
  </defs>

  <rect width="1600" height="1050" fill="#f8fafc"/>

  <text x="60" y="58" class="title">
    Bank Legacy - Arquitectura implementada y validada
  </text>

  <text x="60" y="90" class="subtitle">
    Spring Batch + BFF por canal + microservicios Spring Cloud + Kafka + Oracle
  </text>


  <!-- BATCH -->

  <text x="60" y="145" class="section">
