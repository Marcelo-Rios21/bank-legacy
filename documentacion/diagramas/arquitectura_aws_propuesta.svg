<svg xmlns="http://www.w3.org/2000/svg"
     width="1600"
     height="1000"
     viewBox="0 0 1600 1000">

  <defs>
    <marker id="arrow"
            markerWidth="10"
            markerHeight="10"
            refX="9"
            refY="3"
            orient="auto"
            markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>

    <style>
      .title {
        font: bold 34px Arial, sans-serif;
        fill: #0f172a;
      }

      .warning {
        font: bold 21px Arial, sans-serif;
        fill: #b91c1c;
      }

      .section {
        font: bold 22px Arial, sans-serif;
        fill: #0f172a;
      }

      .boxTitle {
        font: bold 18px Arial, sans-serif;
        fill: #0f172a;
      }

      .text {
        font: 16px Arial, sans-serif;
        fill: #334155;
      }

      .small {
        font: 14px Arial, sans-serif;
        fill: #475569;
      }

      .box {
        fill: #ffffff;
        stroke: #64748b;
        stroke-width: 2;
        rx: 12;
      }

      .aws {
        fill: #fff7ed;
        stroke: #ea580c;
      }

      .service {
        fill: #f0fdf4;
        stroke: #16a34a;
      }

      .infra {
        fill: #ecfeff;
        stroke: #0891b2;
      }

      .external {
        fill: #fefce8;
        stroke: #ca8a04;
      }

      .security {
        fill: #f5f3ff;
        stroke: #7c3aed;
      }

      .boundary {
        fill: none;
        stroke: #f59e0b;
        stroke-width: 3;
        stroke-dasharray: 12 8;
        rx: 18;
      }

      .arrow {
        stroke: #334155;
        stroke-width: 2;
        fill: none;
        marker-end: url(#arrow);
      }

      .dash {
        stroke: #64748b;
        stroke-width: 2;
        fill: none;
        stroke-dasharray: 7 6;
        marker-end: url(#arrow);
      }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#f8fafc"/>

  <text x="60" y="58" class="title">
    Bank Legacy - Arquitectura cloud objetivo
  </text>

  <text x="60" y="92" class="warning">
    PROPUESTA DE DESPLIEGUE AWS - NO IMPLEMENTADA ACTUALMENTE
  </text>

  <rect x="60" y="155"
