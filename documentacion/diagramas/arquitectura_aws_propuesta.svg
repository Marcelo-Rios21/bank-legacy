  </text>

  <rect x="1290" y="330"
        width="250" height="115"
        class="box security"/>

  <text x="1415" y="368"
        text-anchor="middle"
        class="boxTitle">
    Secrets Manager
  </text>

  <text x="1415" y="398"
        text-anchor="middle"
        class="small">
