  </text>

  <path d="M310 210 L430 390"
        class="dash"/>

  <path d="M810 250 L810 580"
        class="arrow"/>

  <path d="M810 250 L540 580"
        class="arrow"/>

  <path d="M810 250 L1080 580"
        class="arrow"/>

  <path d="M535 490 L540 580"
        class="dash"/>

  <path d="M790 490 L810 580"
        class="dash"/>

  <path d="M1065 490 L1080 580"
        class="dash"/>

  <path d="M810 695 L810 750"
        class="arrow"/>

  <path d="M1080 750 L1080 695"
        class="arrow"/>

  <path d="M430 640 L320 730"
        class="arrow"/>

  <path d="M690 640 L320 750"
        class="arrow"/>

  <path d="M970 640 L320 770"
        class="arrow"/>

  <path d="M1290 387 L1190 430"
