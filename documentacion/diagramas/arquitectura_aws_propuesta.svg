  </text>

  <text x="850" y="932"
        class="text">
    No se asume /actuator/health porque Actuator no fue incorporado.
  </text>

  <text x="850" y="958"
        class="text">
    AWS solo se declara implementado cuando existan recursos realmente desplegados.
  </text>

